name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: '--linux appimage rpm'
          - os: macos-latest
            args: '--mac dmg'
          - os: windows-latest
            args: '--win nsis'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (rebuilds better-sqlite3 for this OS)
        run: npm install

      - name: Build bundles
        run: npx electron-vite build

      - name: Package
        run: npx electron-builder ${{ matrix.args }}
        env:
          # Optional: set these secrets to code-sign the mac build
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # Skip windows signing unless configured
          WIN_CSC_LINK: ''
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-streamer-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.dmg
            release/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true